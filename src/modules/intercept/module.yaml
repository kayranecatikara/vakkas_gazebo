module_name: Intercept

parameters:
    - group: Intercept
      definitions:
        INT_ENABLE:
            description:
                short: Enable intercept flight mode
                long: Enables the target intercept autonomous flight mode.
            type: boolean
            default: 1

        INT_TGT_SIZE:
            description:
                short: Desired target bounding box width
                long: Normalized screen width fraction of target for terminal standoff (0.10 to 0.70).
            type: float
            default: 0.50
            min: 0.10
            max: 0.70
            decimal: 2

        INT_MIN_CLOSING:
            description:
                short: Minimum closing speed in position guidance
                long: Minimum relative closing speed (m/s) maintained in midcourse position approach guidance.
            type: float
            default: 6.0
            min: 2.0
            max: 15.0
            decimal: 1

        INT_KP_OPT:
            description:
                short: Optical size error velocity gain
                long: Proportional speed gain (m/s per normalized size error) commanding forward pursuit speed offset.
            type: float
            default: 5.0
            min: 0.5
            max: 15.0
            decimal: 1

        INT_KD_OPT:
            description:
                short: Optical relative velocity damping gain
                long: Derivative damping gain on optical relative closing speed (m/s) matching target velocity.
            type: float
            default: 1.2
            min: 0.1
            max: 10.0
            decimal: 2


        INT_KP_LAT:
            description:
                short: Proportional gain for lateral visual tracking
                long: Proportional gain (m/s per unit screen error cx - 0.5) for centering target horizontally.
            type: float
            default: 2.8
            min: 0.5
            max: 15.0
            decimal: 2

        INT_KP_Z:
            description:
                short: Altitude tracking proportional gain
                long: Proportional gain (m/s per meter altitude error) for terminal standoff altitude tracking.
            type: float
            default: 1.2
            min: 0.2
            max: 5.0
            decimal: 2

        INT_KP_Z_APP:
            description:
                short: Approach mode altitude tracking proportional gain
                long: Proportional gain (m/s per meter altitude error) for midcourse approach altitude tracking.
            type: float
            default: 0.8
            min: 0.1
            max: 3.0
            decimal: 2

        INT_YAW_RATE:
            description:
                short: Maximum heading slew rate
                long: Maximum heading change rate (deg/s) in intercept pursuit guidance.
            type: float
            default: 42.0
            min: 5.0
            max: 60.0
            decimal: 1

        INT_K_CORNER:
            description:
                short: Adaptive corner braking gain
                long: Proportional braking gain on (target_size * lateral_drift) reducing forward speed during turns.
            type: float
            default: 10.0
            min: 0.0
            max: 30.0
            decimal: 1

        INT_LOST_TIMEOUT:
            description:
                short: Visual contact loss timeout
                long: Time in seconds to steer towards target position and re-acquire visual before reverting to approach.
            type: float
            default: 2.0
            min: 0.5
            max: 10.0
            decimal: 1
